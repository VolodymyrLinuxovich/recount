<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="840" height="200">
  <title>Recount</title>
  <g transform="translate(0,0)">
  <rect width="100" height="100" rx="22" fill="#1d2230"/>
  <!-- the bill: a receipt with a torn (zigzag) bottom edge -->
  <path d="M28 16 H72 V78 L66.5 83 L61 78 L55.5 83 L50 78 L44.5 83 L39 78 L33.5 83 L28 78 Z" fill="#f5f0e6"/>
  <!-- printed lines -->
  <rect x="35" y="27" width="22" height="4.2" rx="2.1" fill="#1d2230" opacity="0.85"/>
  <rect x="35" y="37" width="30" height="4.2" rx="2.1" fill="#1d2230" opacity="0.35"/>
  <rect x="35" y="47" width="26" height="4.2" rx="2.1" fill="#1d2230" opacity="0.35"/>
  <!-- the recount: a red pen check -->
  <path d="M36 62 L45.5 71 L69 45" fill="none" stroke="#c0281c" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
  <text x="118" y="68" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="56" font-weight="600" fill="#1d2230" letter-spacing="-1">Recount</text>
</svg>