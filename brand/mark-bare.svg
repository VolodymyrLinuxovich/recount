  <rect x="35" y="37" width="30" height="4.2" rx="2.1" fill="#1d2230" opacity="0.35"/>
  <rect x="35" y="47" width="26" height="4.2" rx="2.1" fill="#1d2230" opacity="0.35"/>
  <!-- the recount: a red pen check -->
  <path d="M36 62 L45.5 71 L69 45" fill="none" stroke="#c0281c" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
