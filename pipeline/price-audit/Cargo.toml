[package]
name = "price-audit"
version = "0.1.0"
edition = "2021"
description = "Stream hospital price transparency files and report what an uninsured patient is quoted next to what insurers pay"
license = "MIT"
publish = false

[[bin]]
name = "price_audit"
path = "src/main.rs"

[dependencies]
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
